asyncapi: 3.0.0
info:
  title: Orders with local Avro
  version: 1.0.0
servers:
  broker:
    host: localhost:9092
    protocol: kafka
channels:
  orders:
    address: orders.created
    messages:
      order:
        payload:
          $ref: '#/components/schemas/Order'
        bindings:
          kafka:
            key:
              $ref: '#/components/schemas/OrderKey'
            bindingVersion: 0.5.0
operations:
  sendOrder:
    action: send
    channel:
      $ref: '#/channels/orders'
components:
  schemas:
    Order:
      schemaFormat: application/vnd.apache.avro;version=1.9.0
      schema:
        $ref: avro/order.avsc
    OrderKey:
      schemaFormat: application/vnd.apache.avro+json;version=1.9.0
      schema: string
