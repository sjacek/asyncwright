dependencies {
    implementation(project(':parser'))
    //noinspection DependencyNotationArgument
    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)
}

tasks.register('runExample', JavaExec) {
    description = 'Run the Java rule and generator against the public example document.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.sjacek.asyncwright.examples.ExampleMain'
    setArgs([layout.projectDirectory.file('events.yaml').asFile.absolutePath,
             layout.buildDirectory.dir('generated-example').get().asFile.absolutePath])
}
