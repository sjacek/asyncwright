name: Gradle and JDK compatibility
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      model_ref:
        description: 'Fork distribution commit SHA (or development branch before release)'
        type: string
        default: build/asyncwright-distribution
  workflow_call:
    inputs:
      model_ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    name: Build pinned model distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: asyncwright
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sjacek/jasyncapi
          ref: ${{ inputs.model_ref || vars.ASYNCWRIGHT_MODEL_REF || 'build/asyncwright-distribution' }}
          path: model
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure fork test toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <toolchains><toolchain><type>jdk</type><provides><version>21</version></provides><configuration><jdkHome>$JAVA_HOME</jdkHome></configuration></toolchain></toolchains>
          EOF
      - name: Build, test and install model into an isolated file repository
        shell: bash
        working-directory: model
        run: |
          python - <<'PY'
          import pathlib, tomllib, xml.etree.ElementTree as ET
          selected = tomllib.loads(pathlib.Path('../asyncwright/gradle/libs.versions.toml').read_text())['versions']['jasyncapi-fork']
          actual = ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          if selected != actual:
              raise SystemExit(f'Model version mismatch: plugin requires {selected}, fork provides {actual}. Push the distribution first.')
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/model-source-commit.txt"
          pwsh -File tools/install-local.ps1 -Repository "$RUNNER_TEMP/model-repository" -Maven mvn
      - uses: actions/upload-artifact@v4
        with:
          name: model-repository
          path: ${{ runner.temp }}/model-repository
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: model-source-commit
          path: ${{ runner.temp }}/model-source-commit.txt
  compatibility:
    needs: model
    name: Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Cold dependency resolution previously received HTTP 429 from Maven Central with all cells at once.
      max-parallel: 3
      matrix:
        gradle: ['9.0.0', '9.1.0', '9.8.1']
        java: ['17', '21', '25']
        exclude:
          - gradle: '9.0.0'
            java: '25'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-repository
          path: ${{ runner.temp }}/model-repository
      - name: Verify plugin and TestKit consumers
        shell: bash
        run: >-
          bash ./gradlew check assemble
          -PasyncwrightModelRepository="$RUNNER_TEMP/model-repository"
          -PtestGradleVersion=${{ matrix.gradle }}
          --configuration-cache-problems=fail --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-gradle-${{ matrix.gradle }}-jdk-${{ matrix.java }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
