plugins {
    id 'base'
}

// Keep machine-specific repository paths out of version control, including IDE imports.
def localProperties = new Properties()
localProperties.load(new StringReader(providers.fileContents(
        layout.projectDirectory.file('gradle/local.properties')).asText.getOrElse('')))
def modelRepository = providers.gradleProperty('asyncwrightModelRepository')
        .getOrElse(localProperties.getProperty('asyncwrightModelRepository', ''))
ext.asyncwrightModelRepository = modelRepository

allprojects {
    group = 'io.github.sjacek.asyncwright'
    version = '0.1.1-SNAPSHOT'
    repositories {
        if (!modelRepository.isBlank()) {
            exclusiveContent {
                forRepository {
                    maven {
                        name = 'asyncwrightModel'
                        url = rootProject.uri(modelRepository)
                    }
                }
                filter { includeGroup 'io.github.sjacek.jasyncapi' }
            }
        }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { into 'META-INF' }
    }
}

tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }

apply from: 'gradle/release-verification.gradle'

tasks.named('wrapper') {
    gradleVersion = '9.8.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f'
}
