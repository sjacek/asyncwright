// F0 dependencies belong only to the spike source set, not the public parser API.
sourceSets {
    f0 {
        java.srcDir 'src/f0/java'
    }
}

dependencies {
    // platform(...) is valid Gradle notation; IDEA cannot infer its type here.
    //noinspection DependencyNotationArgument
    api(platform(libs.jackson.bom))
    api(libs.jackson.databind)
    api(libs.jasyncapi.fork)
    implementation(libs.jackson.yaml)
    implementation(libs.json.schema.validator)
    implementation(libs.joni)

    //noinspection DependencyNotationArgument
    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.junit.jupiter)
    // Explicit IDE nullability contracts in JDK overrides; not part of the parser's published API/runtime.
    testCompileOnly(libs.jetbrains.annotations)
    testRuntimeOnly(libs.junit.platform.launcher)

    f0Implementation 'com.asyncapi:asyncapi-core:1.0.0-RC4'
    f0Implementation enforcedPlatform("com.fasterxml.jackson:jackson-bom:${providers.gradleProperty('f0JacksonVersion').getOrElse(libs.versions.jackson.get())}")
    f0Implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
}

def contractsPath = providers.gradleProperty('contractsDir')
        .getOrElse('../../asyncapi-contracts/modules/asyncapi/src/main/asyncapi')
def contractsDirectory = rootProject.layout.projectDirectory.dir(contractsPath)

tasks.register('f0', JavaExec) {
    description = 'Measure asyncapi-core RC4 against the five real contracts and P1 probes.'
    group = 'verification'
    classpath = sourceSets.f0.runtimeClasspath
    mainClass = 'io.github.sjacek.asyncwright.f0.F0Probe'
    inputs.dir(contractsDirectory).withPropertyName('contracts').withPathSensitivity(PathSensitivity.RELATIVE)
    def reportDirectory = layout.buildDirectory.dir('reports/f0')
    outputs.dir(reportDirectory)
    setArgs([contractsDirectory.asFile.absolutePath, reportDirectory.get().asFile.absolutePath])
}

// Compile the experiment on normal builds; running it requires the external contract corpus.
tasks.named('check') { dependsOn tasks.named('f0Classes') }

tasks.named('test') {
    useJUnitPlatform { excludeTags 'external-corpus', 'public-corpus' }
    // Directory-based TestKit classpaths cannot expose shared JAR resource lifetimes.
    // Load production classes and schema from this archive; fingerprint resource-only packaging changes too.
    def parserJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    dependsOn tasks.named('jar')
    inputs.file(parserJar).withPropertyName('packagedParser').withPathSensitivity(PathSensitivity.NONE)
    systemProperty 'asyncwright.parserJar', parserJar.get().asFile.absolutePath
}

tasks.register('publicCorpusTest', Test) {
    description = 'Check the public AsyncAPI corpus against reviewed outcomes and write a comparison report.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'public-corpus' }
    def report = layout.buildDirectory.file('reports/conformance/asyncwright.json')
    outputs.file(report)
    systemProperty 'asyncwright.publicCorpusReport', report.get().asFile.absolutePath
}

tasks.named('check') { dependsOn tasks.named('publicCorpusTest') }

tasks.register('contractCorpusTest', Test) {
    description = 'Validate and resolve the nine external AsyncAPI contracts with the production parser.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'external-corpus' }
    inputs.dir(contractsDirectory).withPropertyName('contracts').withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'asyncwright.contractsDir', contractsDirectory.asFile.absolutePath
    def report = layout.buildDirectory.file('reports/asyncapi-corpus/result.json')
    outputs.file(report)
    systemProperty 'asyncwright.corpusReport', report.get().asFile.absolutePath
}
